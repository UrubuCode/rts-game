name: Build rts-game executable

# Gera o executável NATIVO do rts-game via AOT (`rts compile`).
#
# NÃO buildamos o motor do source (~15min): baixamos o `rts.exe` do LATEST RELEASE
# do motor (UrubuCode/rts). Esse binário já é AOT-capaz — o build do release passa
# um "AOT smoke" BLOCKING, então a staticlib do runtime está embutida nele. Só
# precisamos de um LINKER no runner (rust-lld + libs MSVC) pro passo de link do AOT.
#
# Dispara em push no master + manualmente (workflow_dispatch).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # publicar o release (tag + assets)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout rts-game
        uses: actions/checkout@v4

      # rust-lld (o linker que o AOT usa) vem com a toolchain. Setup rápido (~1min),
      # sem buildar nada.
      - name: Setup Rust (rust-lld pro link AOT)
        uses: dtolnay/rust-toolchain@stable

      # link.exe + libs do Windows (kernel32.lib etc) que o link AOT precisa.
      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      # Baixa o rts.exe AOT-capaz do latest release do motor — sem compilar o motor.
      - name: Baixar rts.exe do latest release do motor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo UrubuCode/rts --pattern '*Windows-X64.exe' --output rts.exe
          ls -la rts.exe

      # AOT: compila DOIS binários nativos. O runtime (embutido no rts.exe) é
      # linkado dentro — os exes rodam sozinhos, sem o rts.exe.
      #   rts-game.exe  = o EDITOR   (main.ts)
      #   RTSGame.exe   = o JOGO     (game.ts — sem painéis, abre direto na cena)
      - name: AOT compile (editor + jogo)
        shell: bash
        run: |
          mkdir -p release
          ./rts.exe compile main.ts release/rts-game
          ./rts.exe compile game.ts release/RTSGame
          ls -la release/

      # Empacota os exes + os assets lidos em RUNTIME.
      # `scenes/` é obrigatório: sem ele o jogo abre com 0 objetos, porque
      # assets/scene.json (a cena do usuário) é ignorada pelo git de propósito.
      - name: Stage bundle (exes + assets + scenes)
        shell: bash
        run: |
          mkdir -p bundle
          cp release/rts-game.exe bundle/ 2>/dev/null || true
          cp release/RTSGame.exe bundle/ 2>/dev/null || true
          cp -r assets bundle/assets 2>/dev/null || true
          cp -r scenes bundle/scenes 2>/dev/null || true
          # sanidade: sem uma cena o jogo abre vazio — falha o build antes de publicar
          test -f bundle/scenes/shadowdemo.json || { echo "ERRO: scenes/ nao foi empacotado"; exit 1; }
          ls -la bundle/ bundle/scenes/

      - name: Upload executable (artefato do run)
        uses: actions/upload-artifact@v4
        with:
          name: rts-game-windows
          path: bundle/**
          if-no-files-found: error

      # ── RELEASE permanente (não só o artefato temporário do run) ──
      # Zipa o bundle (exe + assets) num único asset e publica um GitHub Release
      # versionado por data+sha, marcado como latest. Só em push no master (não em
      # workflow_dispatch, pra não poluir com releases de teste manual).
      - name: Zipar o bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd bundle
          powershell -Command "Compress-Archive -Path * -DestinationPath ../rts-game-windows.zip -Force"
          cd ..
          ls -la rts-game-windows.zip

      - name: Gerar tag
        if: github.event_name == 'push'
        id: tag
        shell: bash
        run: echo "tag=game-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: rts-game ${{ steps.tag.outputs.tag }}
          body: |
            Executáveis nativos (Windows x64), gerados por AOT (`rts compile`)
            sobre o rts.exe do release do motor. Baixe o zip e extraia — as
            pastas `assets/` e `scenes/` precisam ficar AO LADO dos exes.

            - **`RTSGame.exe`** — o JOGO: abre direto na cena, sem painéis de
              edição. Renderiza pela câmera da cena. WASD voa, botão direito
              gira, espaço sobe.
            - **`rts-game.exe`** — o EDITOR: hierarquia, inspector, Project com
              thumbnails, drag & drop de assets, gizmo.

            O jogo carrega `assets/scene.json` (a cena que você salva no editor);
            se ela não existir, cai em `scenes/shadowdemo.json`.
          files: rts-game-windows.zip
          fail_on_unmatched_files: true
          make_latest: true
