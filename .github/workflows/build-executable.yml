name: Build rts-game executable

# Gera o executável NATIVO do rts-game via AOT (`rts compile`).
#
# NÃO buildamos o motor do source (~15min): baixamos o `rts.exe` do LATEST RELEASE
# do motor (UrubuCode/rts). Esse binário já é AOT-capaz — o build do release passa
# um "AOT smoke" BLOCKING, então a staticlib do runtime está embutida nele. Só
# precisamos de um LINKER no runner (rust-lld + libs MSVC) pro passo de link do AOT.
#
# Dispara em push no master + manualmente (workflow_dispatch).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # publicar o release (tag + assets)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout rts-game
        uses: actions/checkout@v4

      # rust-lld (o linker que o AOT usa) vem com a toolchain. Setup rápido (~1min),
      # sem buildar nada.
      - name: Setup Rust (rust-lld pro link AOT)
        uses: dtolnay/rust-toolchain@stable

      # link.exe + libs do Windows (kernel32.lib etc) que o link AOT precisa.
      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      # Baixa o rts.exe AOT-capaz do latest release do motor — sem compilar o motor.
      - name: Baixar rts.exe do latest release do motor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo UrubuCode/rts --pattern '*Windows-X64.exe' --output rts.exe
          ls -la rts.exe

      # AOT: compila o editor/jogo num binário nativo. O runtime (embutido no rts.exe)
      # é linkado dentro — o exe resultante roda sozinho, sem o rts.exe.
      - name: AOT compile rts-game
        shell: bash
        run: |
          mkdir -p release
          ./rts.exe compile main.ts release/rts-game
          ls -la release/

      # Empacota o exe + os assets que o editor lê em runtime (cenas/modelos/texturas).
      - name: Stage bundle (exe + assets)
        shell: bash
        run: |
          mkdir -p bundle
          cp -r release/* bundle/ 2>/dev/null || true
          cp -r assets bundle/assets 2>/dev/null || true

      - name: Upload executable (artefato do run)
        uses: actions/upload-artifact@v4
        with:
          name: rts-game-windows
          path: bundle/**
          if-no-files-found: error

      # ── RELEASE permanente (não só o artefato temporário do run) ──
      # Zipa o bundle (exe + assets) num único asset e publica um GitHub Release
      # versionado por data+sha, marcado como latest. Só em push no master (não em
      # workflow_dispatch, pra não poluir com releases de teste manual).
      - name: Zipar o bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd bundle
          powershell -Command "Compress-Archive -Path * -DestinationPath ../rts-game-windows.zip -Force"
          cd ..
          ls -la rts-game-windows.zip

      - name: Gerar tag
        if: github.event_name == 'push'
        id: tag
        shell: bash
        run: echo "tag=game-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: rts-game ${{ steps.tag.outputs.tag }}
          body: |
            Executável nativo do editor rts-game (Windows x64), gerado por AOT
            (`rts compile`) sobre o rts.exe do release do motor. Baixe o zip,
            extraia e rode `rts-game.exe` (a pasta `assets/` precisa ficar ao lado).
          files: rts-game-windows.zip
          fail_on_unmatched_files: true
          make_latest: true
