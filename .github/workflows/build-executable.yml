name: Build rts-game executable

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar fontes e contrato do runtime
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:runner
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:components
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:runtime-contract
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run components:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check:params
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Ler toolchain fixada
        id: runtime
        shell: pwsh
        run: |
          $lock = Get-Content runtime.lock.json -Raw | ConvertFrom-Json
          "rust=$($lock.rust)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.runtime.outputs.rust }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Construir runtime da revisao e patch fixados
        run: npm run runtime:prepare
      - name: Verificar capacidades e registro do jogo
        shell: pwsh
        run: |
          npm run test:runtime-runner
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run runtime:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check:game-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:world
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: AOT smoke e compilacao do editor e jogo
        shell: pwsh
        run: |
          node tools/rts-build.mjs tests/runtime-capabilities.ts release/runtime-smoke.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./release/runtime-smoke.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/rts-build.mjs main.ts release/rts-game.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/rts-build.mjs tools/game-build/entry.ts release/RTSGame.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Empacotar artefatos obrigatorios e proveniencia
        run: node tools/stage-bundle.mjs
      - name: Verificar compilacao pela IDE empacotada
        shell: pwsh
        working-directory: bundle
        run: |
          Remove-Item Env:RTS_COMPILER -ErrorAction SilentlyContinue
          node tools/rts-build.mjs tests/runtime-capabilities.ts build/runtime-smoke.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/runtime-smoke.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: rts-game-windows
          path: bundle/**
          if-no-files-found: error
      - name: Preparar release
        if: github.event_name == 'push'
        id: release
        shell: pwsh
        run: |
          Compress-Archive -Path bundle/* -DestinationPath rts-game-windows.zip -Force
          $tag = "game-" + (Get-Date -AsUTC -Format "yyyyMMdd-HHmm") + "-" + $env:GITHUB_SHA.Substring(0,7)
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: rts-game ${{ steps.release.outputs.tag }}
          body: |
            Editor e jogo Windows x64, compilados com o runtime fixado em runtime.lock.json.
            A IDE inclui compilador RTS, staticlib, fontes, ferramentas e assets/cenas.
            O Build ainda requer Node.js e ferramentas de linkedição Windows; consulte LEIA-ME.md.
            Extraia todas as pastas junto dos executaveis.
          files: rts-game-windows.zip
          fail_on_unmatched_files: true
          make_latest: true
