name: Build rts-game executable

# Gera o executável NATIVO do rts-game via AOT (`rts compile`).
#
# NÃO buildamos o motor do source (~15min): baixamos o `rts.exe` do LATEST RELEASE
# do motor (UrubuCode/rts). Só precisamos de um LINKER no runner (rust-lld + libs
# MSVC) pro passo de link do AOT.
#
# CUIDADO, e esta linha já esteve errada: o `rts.exe` baixado carrega UMA
# staticlib embutida, a do caminho SEM compilador. A do caminho COM compilador
# (`rts_runtime_jit.lib`, hoje o padrão) NÃO está embutida e NÃO é publicada como
# asset — por isso o passo de AOT abaixo passa `--no-compiler`. O texto anterior
# dizia "a staticlib do runtime está embutida nele", sem dizer QUAL, e foi essa
# meia-verdade que deixou o build vermelho sem que ninguém desconfiasse do
# comentário.
#
# Dispara em push no master + manualmente (workflow_dispatch).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # publicar o release (tag + assets)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout rts-game
        uses: actions/checkout@v4

      # rust-lld (o linker que o AOT usa) vem com a toolchain. Setup rápido (~1min),
      # sem buildar nada.
      - name: Setup Rust (rust-lld pro link AOT)
        uses: dtolnay/rust-toolchain@stable

      # link.exe + libs do Windows (kernel32.lib etc) que o link AOT precisa.
      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      # Baixa o rts.exe AOT-capaz do latest release do motor — sem compilar o motor.
      - name: Baixar rts.exe do latest release do motor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo UrubuCode/rts --pattern '*Windows-X64.exe' --output rts.exe
          ls -la rts.exe

      # AOT: compila DOIS binários nativos. O runtime (embutido no rts.exe) é
      # linkado dentro — os exes rodam sozinhos, sem o rts.exe.
      #   rts-game.exe  = o EDITOR   (main.ts)
      #   RTSGame.exe   = o JOGO     (game.ts — sem painéis, abre direto na cena)
      #
      # ── POR QUE `--no-compiler`, e por que SEM ele isto não compila ────
      #
      # Desde a mudança #2681 do motor, `--embed-compiler` é o PADRÃO: o exe
      # gerado carrega um compilador dentro, para `eval`, `new Function` e
      # `<script>` de página funcionarem em tempo de execução.
      #
      # Esse caminho precisa linkar contra `rts_runtime_jit.lib`, e
      # `runtime_archive()` em `rts-cli/src/cli/mod.rs` o procura ao lado do
      # binário ou em `target/{debug,release,fast}`. Aqui não há nenhum dos
      # dois: baixamos um `rts.exe` solto de um release, e o comentário do
      # próprio motor diz que "um binário vivendo em qualquer outro lugar —
      # instalado, baixado — simplesmente não tem archive ao lado". O caminho
      # com compilador NÃO tem fallback embutido, de propósito: fingir que o
      # archive padrão serviria descartaria em silêncio a única coisa que o
      # `--embed-compiler` pediu. O erro era:
      #
      #   error: no `rts_runtime_jit.lib` under target/{debug,release,fast}
      #          nor beside this binary
      #
      # `--no-compiler` linka o archive pequeno, que TEM fallback embutido
      # no próprio `rts.exe` — então funciona com um binário baixado, sem
      # asset novo no release e sem mudança no motor.
      #
      # O QUE SE PERDE, dito em vez de escondido: `eval`, `new Function` e
      # `vm.runInNewContext` passam a levantar nos exes gerados. Este jogo
      # nunca lê código em tempo de execução — ele carrega CENAS, que são
      # JSON — então é exatamente o caso para o qual essa opção existe.
      - name: AOT compile (editor + jogo)
        shell: bash
        run: |
          mkdir -p release
          ./rts.exe compile --no-compiler main.ts release/rts-game
          ./rts.exe compile --no-compiler game.ts release/RTSGame
          ls -la release/

      # Empacota os exes + os assets lidos em RUNTIME.
      # `scenes/` é obrigatório: sem ele o jogo abre com 0 objetos, porque
      # assets/scene.json (a cena do usuário) é ignorada pelo git de propósito.
      - name: Stage bundle (exes + assets + scenes)
        shell: bash
        run: |
          mkdir -p bundle
          # Exe e manifesto formam um par: sem .rtsdata o runtime AOT nao abre.
          # Uma compilacao sem qualquer um deles deve falhar no empacotamento.
          cp release/rts-game.exe release/rts-game.rtsdata bundle/
          cp release/RTSGame.exe release/RTSGame.rtsdata bundle/
          cp -r assets bundle/assets 2>/dev/null || true
          cp -r scenes bundle/scenes 2>/dev/null || true
          # sanidade: sem uma cena o jogo abre vazio — falha o build antes de publicar
          test -f bundle/scenes/shadowdemo.json || { echo "ERRO: scenes/ nao foi empacotado"; exit 1; }
          ls -la bundle/ bundle/scenes/

      - name: Upload executable (artefato do run)
        uses: actions/upload-artifact@v4
        with:
          name: rts-game-windows
          path: bundle/**
          if-no-files-found: error

      # ── RELEASE permanente (não só o artefato temporário do run) ──
      # Zipa o bundle (exe + assets) num único asset e publica um GitHub Release
      # versionado por data+sha, marcado como latest. Só em push no master (não em
      # workflow_dispatch, pra não poluir com releases de teste manual).
      - name: Zipar o bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd bundle
          powershell -Command "Compress-Archive -Path * -DestinationPath ../rts-game-windows.zip -Force"
          cd ..
          ls -la rts-game-windows.zip

      - name: Gerar tag
        if: github.event_name == 'push'
        id: tag
        shell: bash
        run: echo "tag=game-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: rts-game ${{ steps.tag.outputs.tag }}
          body: |
            Executáveis nativos (Windows x64), gerados por AOT (`rts compile`)
            sobre o rts.exe do release do motor. Baixe o zip e extraia — as
            arquivos `.rtsdata` e pastas `assets/` e `scenes/` precisam ficar AO LADO dos exes.

            - **`RTSGame.exe`** — o JOGO: abre direto na cena, sem painéis de
              edição. Renderiza pela câmera da cena. WASD voa, botão direito
              gira, espaço sobe.
            - **`rts-game.exe`** — o EDITOR: hierarquia, inspector, Project com
              thumbnails, drag & drop de assets, gizmo.

            O jogo carrega `assets/scene.json` (a cena que você salva no editor);
            se ela não existir, cai em `scenes/shadowdemo.json`.
          files: rts-game-windows.zip
          fail_on_unmatched_files: true
          make_latest: true
